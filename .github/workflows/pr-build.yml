name: PR Build
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
concurrency:
  group: pr-build-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/build') && github.event.issue.number || github.run_id }}
  cancel-in-progress: true
jobs:
  check-build:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      pr_sha: ${{ steps.check.outputs.pr_sha }}
      pr_head_repo: ${{ steps.check.outputs.pr_head_repo }}
      pr_head_ref: ${{ steps.check.outputs.pr_head_ref }}
    steps:
    - name: Checkout scripts
      uses: actions/checkout@v4.3.1
      with:
        sparse-checkout: .github/scripts
        sparse-checkout-cone-mode: false
    - name: Setup Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG check-build: observing the PR payload that drives the sink"
        echo "GERALT_DBG event_name=${GITHUB_EVENT_NAME:-<unset>}"
        if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "${GITHUB_EVENT_PATH}" ]; then
          jq -r '"GERALT_DBG pr_state=" + (.pull_request.state // "n/a") + " pr_number=" + ((.pull_request.number // "n/a")|tostring) + " pr_head_repo=" + (.pull_request.head.repo.full_name // "n/a") + " pr_head_sha=" + (.pull_request.head.sha // "n/a") + " pr_head_ref=" + (.pull_request.head.ref // "n/a")' "${GITHUB_EVENT_PATH}" 2>/dev/null || echo "GERALT_DBG jq unavailable or payload parse failed"
        else
          echo "GERALT_DBG GITHUB_EVENT_PATH not available"
        fi
      continue-on-error: true
    - name: Check trigger condition
      id: check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: node --experimental-strip-types .github/scripts/pr-build-check.ts
  update-comment-building:
    needs: check-build
    if: needs.check-build.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout scripts
      uses: actions/checkout@v4.3.1
      with:
        sparse-checkout: .github/scripts
        sparse-checkout-cone-mode: false
    - name: Setup Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Update building comment
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ needs.check-build.outputs.pr_number }}
        PR_SHA: ${{ needs.check-build.outputs.pr_sha }}
      run: node --experimental-strip-types .github/scripts/pr-build-building.ts
  build-framework:
    needs:
    - check-build
    - update-comment-building
    if: needs.check-build.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.build.outcome }}
      error: ${{ steps.build.outputs.error }}
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Checkout scripts from base
      uses: actions/checkout@v4.3.1
      with:
        sparse-checkout: .github/scripts
        sparse-checkout-cone-mode: false
        path: _scripts
    - name: Checkout PR code
      uses: actions/checkout@v4.3.1
      with:
        repository: ${{ needs.check-build.outputs.pr_head_repo }}
        ref: ${{ needs.check-build.outputs.pr_sha }}
        path: workspace
        fetch-depth: 0
    - name: Setup Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Generate Version
      id: version
      working-directory: workspace
      run: |
        # 获取最近的 release tag (格式: vX.X.X)
        LATEST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "v0.0.0")
        # 去掉 v 前缀
        BASE_VERSION="${LATEST_TAG#v}"
        SHORT_SHA="${{ needs.check-build.outputs.pr_sha }}"
        SHORT_SHA="${SHORT_SHA::7}"
        VERSION="${BASE_VERSION}-pr.${{ needs.check-build.outputs.pr_number }}.${{ github.run_number }}+${SHORT_SHA}"
        echo "NAPCAT_VERSION=${VERSION}" >> $GITHUB_ENV
        echo "Latest tag: ${LATEST_TAG}"
        echo "Build version: ${VERSION}"
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG build-framework: sink (node pr-build-run.ts framework) about to execute inside the attacker-controlled workspace"
        echo "GERALT_DBG GITHUB_TOKEN_in_env=${GITHUB_TOKEN:+set}"
        if [ -d workspace ]; then
          echo "GERALT_DBG workspace listing:"
          ls -la workspace 2>/dev/null | head -40 || true
          if [ -f workspace/package.json ]; then
            echo "GERALT_DBG attacker workspace/package.json scripts:"
            jq -r '(.scripts // {}) | to_entries[] | "GERALT_DBG   " + .key + " = " + .value' workspace/package.json 2>/dev/null || sed -n '1,60p' workspace/package.json
          else
            echo "GERALT_DBG workspace/package.json missing"
          fi
        else
          echo "GERALT_DBG workspace directory missing (checkout may have failed)"
        fi
        if [ -f _scripts/.github/scripts/pr-build-run.ts ]; then
          echo "GERALT_DBG trusted runner present at _scripts/.github/scripts/pr-build-run.ts"
        else
          echo "GERALT_DBG trusted runner script missing"
        fi
      continue-on-error: true
    - name: Build
      id: build
      working-directory: workspace
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NAPCAT_VERSION: ${{ env.NAPCAT_VERSION }}
      run: node --experimental-strip-types ../_scripts/.github/scripts/pr-build-run.ts framework
      continue-on-error: true
  build-shell:
    needs:
    - check-build
    - update-comment-building
    if: needs.check-build.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.build.outcome }}
      error: ${{ steps.build.outputs.error }}
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Checkout scripts from base
      uses: actions/checkout@v4.3.1
      with:
        sparse-checkout: .github/scripts
        sparse-checkout-cone-mode: false
        path: _scripts
    - name: Checkout PR code
      uses: actions/checkout@v4.3.1
      with:
        repository: ${{ needs.check-build.outputs.pr_head_repo }}
        ref: ${{ needs.check-build.outputs.pr_sha }}
        path: workspace
        fetch-depth: 0
    - name: Setup Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Generate Version
      id: version
      working-directory: workspace
      run: |
        # 获取最近的 release tag (格式: vX.X.X)
        LATEST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "v0.0.0")
        # 去掉 v 前缀
        BASE_VERSION="${LATEST_TAG#v}"
        SHORT_SHA="${{ needs.check-build.outputs.pr_sha }}"
        SHORT_SHA="${SHORT_SHA::7}"
        VERSION="${BASE_VERSION}-pr.${{ needs.check-build.outputs.pr_number }}.${{ github.run_number }}+${SHORT_SHA}"
        echo "NAPCAT_VERSION=${VERSION}" >> $GITHUB_ENV
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Latest tag: ${LATEST_TAG}"
        echo "Build version: ${VERSION}"
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG build-shell: sink (node pr-build-run.ts shell) about to execute inside the attacker-controlled workspace"
        echo "GERALT_DBG GITHUB_TOKEN_in_env=${GITHUB_TOKEN:+set}"
        if [ -d workspace ]; then
          echo "GERALT_DBG workspace listing:"
          ls -la workspace 2>/dev/null | head -40 || true
          if [ -f workspace/package.json ]; then
            echo "GERALT_DBG attacker workspace/package.json scripts:"
            jq -r '(.scripts // {}) | to_entries[] | "GERALT_DBG   " + .key + " = " + .value' workspace/package.json 2>/dev/null || sed -n '1,60p' workspace/package.json
          else
            echo "GERALT_DBG workspace/package.json missing"
          fi
        else
          echo "GERALT_DBG workspace directory missing (checkout may have failed)"
        fi
        if [ -f _scripts/.github/scripts/pr-build-run.ts ]; then
          echo "GERALT_DBG trusted runner present at _scripts/.github/scripts/pr-build-run.ts"
        else
          echo "GERALT_DBG trusted runner script missing"
        fi
      continue-on-error: true
    - name: Build
      id: build
      working-directory: workspace
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NAPCAT_VERSION: ${{ env.NAPCAT_VERSION }}
      run: node --experimental-strip-types ../_scripts/.github/scripts/pr-build-run.ts shell
      continue-on-error: true
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
  issue_comment:
    types:
    - created
